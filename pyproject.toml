[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stylepilot"
version = "0.1.0"
description = "A scene-aware editing agent for Adobe Lightroom Classic"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "StylePilot contributors" }]
dependencies = [
    "httpx[socks]>=0.27,<1.0",
    "langgraph>=1.0,<2.0",
    "mcp>=2.0,<3.0",
    "numpy>=2.1,<3.0",
    "openai>=2.0,<3.0",
    "pillow>=11.0,<13.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "scikit-image>=0.25,<1.0",
]

[project.scripts]
stylepilot = "stylepilot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.11",
    "ty>=0.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stylepilot"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["stylepilot"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["stylepilot"]
